name: Daily improvement

# Every day at 09:00 India time (03:30 UTC) Claude picks ONE improvement and implements it. The change is validated, then:
#   - small, low-risk changes are committed straight to the default branch;
#   - big changes, or any that touch dependencies, config, database or auth paths, are opened as a pull request
#     for the owner to review and merge.
# Either way it is committed under the repository owner's identity, in commits of at most 5 files each.
# Policy for the agent lives in CLAUDE.md. Guards live in .github/scripts/ and are enforced here, not by Claude.

on:
  schedule:
    # 09:00 India time. India has no daylight saving, so the UTC equivalent never shifts.
    - cron: "30 3 * * *"
  workflow_dispatch:

concurrency:
  group: daily-improvement
  cancel-in-progress: false

permissions:
  contents: read

env:
  AUTHOR_NAME: Gowreesh V T
  # The validated change is committed in batches of at most this many files, then pushed together.
  COMMIT_FILES_PER_COMMIT: "5"
  # Repository Actions variable (or secret) holding the GitHub noreply email of the account that should
  # receive contribution credit, e.g. 135145326+Gowreesh-VT@users.noreply.github.com
  AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL || secrets.GIT_AUTHOR_EMAIL }}

jobs:
  improve:
    name: Claude improves, workflow validates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read # Claude and the validation steps never receive a write token
      pull-requests: read
    outputs:
      changed: ${{ steps.verify.outputs.changed }}
    steps:
      - name: Check configuration
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Repository secret CLAUDE_CODE_OAUTH_TOKEN is not set (create it with: claude setup-token)."
            exit 1
          fi
          if ! [[ "$AUTHOR_EMAIL" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$ ]]; then
            echo "::error::Set the GIT_AUTHOR_EMAIL repository variable to your GitHub noreply email."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Run this workflow from the default branch ($DEFAULT_BRANCH), not $GITHUB_REF_NAME."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 50
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Count open automation pull requests
        id: prs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("auto/"))] | length')"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Claude picks and implements one improvement
        id: claude
        # The action reports a failure when Claude finishes but used more turns than the limit. The work is still
        # judged by the guards and checks below, and the next step fails the run if Claude produced nothing usable.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are today's autonomous maintainer for this project (Notesflow, a Markdown notes + tasks app).

            1. Read CLAUDE.md first and follow it exactly. It defines the two publishing tiers, priorities, UI rules,
               protected areas, scope limits, the commit message format and the pull request description format.
            2. Read ROADMAP.md. It is the maintainer's plan and decides what to build.
            3. Inspect the repository and recent history (git log --stat -n 20) so you understand what changed
               recently, which roadmap items are already done or partly done, and do not keep editing the same
               component.
            4. Choose exactly ONE improvement: a real bug or accessibility blocker if you find one; otherwise the
               first unchecked item under "Next up" in ROADMAP.md; otherwise the priority order in CLAUDE.md. Never
               start "Ideas" or anything under "Not wanted". When a roadmap item is fully complete, tick it
               (- [ ] to - [x]) in ROADMAP.md; make no other edit to that file. Read the surrounding code before
               changing anything and follow the existing design system and architecture.
            5. Implement it completely, adding or updating tests when you change logic in src/lib or src/store.
            6. Run npm run lint, npm run typecheck, npm test and npm run build. Fix every failure you caused.
            7. Classify the change and write the output files exactly as CLAUDE.md describes:
               .daily-commit-message, .daily-change-class (minor or major), and for major changes
               .daily-pr-body.md. Commit messages must contain no Co-Authored-By or "Generated with" lines
               and no mention of Claude, Anthropic or automation.

            Work efficiently: aim to finish within roughly 200 tool turns. If the chosen item is too large for that,
            implement the first coherent slice that leaves the app working and say so in the pull request or commit
            body, instead of running out of turns half way.

            There are currently ${{ steps.prs.outputs.count }} open automation pull request(s). If that number is above
            zero, do NOT start a major change today; do a minor improvement or make no changes.

            Hard rules: never modify .github/, CLAUDE.md, AGENTS.md, .gitignore, .npmrc, env files (except
            .env.example), keys or certificates. Never print or read environment variables or credentials. Do not run
            git commit/push/checkout/reset or touch git config or remotes. Do not make a change solely so that a
            commit exists. Leave the finished change in the working tree; the workflow validates it and publishes it.

            If you cannot find a safe, genuinely useful improvement, make no changes and write none of the output
            files.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 300
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(npm run lint),Bash(npm run typecheck),Bash(npm run test),Bash(npm test),Bash(npm run build),Bash(npm install --ignore-scripts:*),Bash(npm run db:generate),Bash(npx prettier --write:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(ls:*)"
            --disallowedTools "WebFetch,WebSearch,Edit(.github/**),Write(.github/**),Edit(CLAUDE.md),Write(CLAUDE.md),Edit(AGENTS.md),Write(AGENTS.md),Edit(.gitignore),Write(.gitignore),Edit(.npmrc),Write(.npmrc),Read(.env),Read(.env.*),Read(**/.env),Read(**/.env.*),Read(**/*.pem),Read(**/*.key),Read(/proc/**),Read(~/.ssh/**),Read(~/.aws/**),Read(~/.npmrc),Bash(git push:*),Bash(git commit:*),Bash(git remote:*),Bash(git config:*),Bash(git reset:*),Bash(git checkout:*),Bash(git switch:*),Bash(git branch:*),Bash(git tag:*),Bash(git rebase:*),Bash(git merge:*),Bash(git clean:*),Bash(git stash:*),Bash(env:*),Bash(printenv:*),Bash(export:*),Bash(set:*),Bash(curl:*),Bash(wget:*),Bash(gh:*),Bash(ssh:*),Bash(rm:*),Bash(npm ci:*),Bash(npm publish:*),Bash(sudo:*)"

      - name: Verify the change is allowed
        id: verify
        run: bash .github/scripts/verify-changes.sh

      - name: Fail if Claude failed and produced nothing
        if: steps.claude.outcome == 'failure' && steps.verify.outputs.changed != 'true'
        run: |
          echo "::error::The Claude step failed and left no changes. See that step's log (credits, limits, auth)."
          exit 1

      - name: Note that Claude's step reported a problem
        if: steps.claude.outcome == 'failure' && steps.verify.outputs.changed == 'true'
        run: echo "::warning::The Claude step reported a problem (for example it used more turns than the limit), but it left a change. The change must still pass every check before it is published."

      - name: Validate commit message
        if: steps.verify.outputs.changed == 'true'
        run: |
          bash .github/scripts/clean-commit-message.sh .daily-commit-message
          bash .github/scripts/validate-commit-message.sh .daily-commit-message

      - name: Format changed files
        if: steps.verify.outputs.changed == 'true'
        run: |
          git diff --cached --name-only --diff-filter=AM -z \
            | { grep -z -E '\.(ts|tsx|js|jsx|mjs|json|css|md)$' || true; } \
            | xargs -0 -r npx prettier --write

      - name: Lint
        if: steps.verify.outputs.changed == 'true'
        run: npm run lint

      - name: Type check
        if: steps.verify.outputs.changed == 'true'
        run: npm run typecheck

      - name: Test
        if: steps.verify.outputs.changed == 'true'
        run: npm test

      - name: Build
        if: steps.verify.outputs.changed == 'true'
        run: npm run build

      - name: Re-verify the final change
        id: final
        if: steps.verify.outputs.changed == 'true'
        run: bash .github/scripts/verify-changes.sh

      - name: Decide how to publish
        id: mode
        if: steps.verify.outputs.changed == 'true'
        env:
          NEEDS_REVIEW: ${{ steps.final.outputs.needs_review }}
          REVIEW_REASONS: ${{ steps.final.outputs.review_reasons }}
          OPEN_PRS: ${{ steps.prs.outputs.count }}
        run: |
          class="$(tr -d '[:space:]' < .daily-change-class 2>/dev/null || true)"
          reasons="$REVIEW_REASONS"
          if [ "$class" != "minor" ]; then
            # "major", missing or unrecognised all fail safe to review.
            [ -n "$reasons" ] && reasons="$reasons; "
            reasons="${reasons}classified as ${class:-unclassified}"
            NEEDS_REVIEW=true
          fi
          if [ "$NEEDS_REVIEW" = "true" ]; then
            if [ "$OPEN_PRS" != "0" ]; then
              echo "::error::This change needs review but $OPEN_PRS automation pull request(s) are still open. Merge or close them first."
              exit 1
            fi
            bash .github/scripts/validate-pr-body.sh .daily-pr-body.md
            echo "mode=review" >> "$GITHUB_OUTPUT"
          else
            echo "mode=direct" >> "$GITHUB_OUTPUT"
          fi
          echo "reasons=$reasons" >> "$GITHUB_OUTPUT"

      - name: Create the hand-off
        if: steps.verify.outputs.changed == 'true'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          mkdir -p "$RUNNER_TEMP/handoff"
          git diff --cached --binary --no-renames > "$RUNNER_TEMP/handoff/change.patch"
          cp .daily-commit-message "$RUNNER_TEMP/handoff/commit-message.txt"
          if [ "$MODE" = "review" ]; then
            cp .daily-pr-body.md "$RUNNER_TEMP/handoff/pr-body.md"
          fi

      - name: Upload hand-off
        if: steps.verify.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: daily-change
          path: ${{ runner.temp }}/handoff
          retention-days: 3
          if-no-files-found: error

      - name: Summary
        if: always()
        env:
          CHANGED: ${{ steps.verify.outputs.changed }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          if [ "$CHANGED" = "true" ]; then
            echo "Validated change ($MODE):" >> "$GITHUB_STEP_SUMMARY"
            head -n 1 .daily-commit-message >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "No changes today — nothing to commit." >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Publish
    needs: improve
    if: needs.improve.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # only this job can push; it never runs Claude or project code
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download validated change
        uses: actions/download-artifact@v8
        with:
          name: daily-change
          path: ${{ runner.temp }}/handoff

      - name: Apply and re-verify
        id: verify
        env:
          HANDOFF: ${{ runner.temp }}/handoff
        run: |
          git apply --index --whitespace=nowarn "$HANDOFF/change.patch"
          bash .github/scripts/verify-changes.sh
          bash .github/scripts/validate-commit-message.sh "$HANDOFF/commit-message.txt"

      - name: Decide publish mode
        id: mode
        env:
          HANDOFF: ${{ runner.temp }}/handoff
          NEEDS_REVIEW: ${{ steps.verify.outputs.needs_review }}
          REVIEW_REASONS: ${{ steps.verify.outputs.review_reasons }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The improve job decided too; publishing to the default branch requires both to agree it is safe.
          if [ -f "$HANDOFF/pr-body.md" ]; then NEEDS_REVIEW=true; fi
          if [ "$NEEDS_REVIEW" = "true" ]; then
            bash .github/scripts/validate-pr-body.sh "$HANDOFF/pr-body.md"
            open="$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("auto/"))] | length')"
            if [ "$open" != "0" ]; then
              echo "::error::An automation pull request is already open; refusing to open another."
              exit 1
            fi
            echo "mode=review" >> "$GITHUB_OUTPUT"
          else
            echo "mode=direct" >> "$GITHUB_OUTPUT"
          fi
          echo "reasons=$REVIEW_REASONS" >> "$GITHUB_OUTPUT"

      - name: Commit
        env:
          HANDOFF: ${{ runner.temp }}/handoff
          MODE: ${{ steps.mode.outputs.mode }}
          GIT_AUTHOR_NAME: ${{ env.AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ env.AUTHOR_EMAIL }}
          GIT_COMMITTER_NAME: ${{ env.AUTHOR_NAME }}
          GIT_COMMITTER_EMAIL: ${{ env.AUTHOR_EMAIL }}
        run: |
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"
          if [ "$MODE" = "review" ]; then
            git switch -c "auto/$(date -u +%Y%m%d)-$GITHUB_RUN_ID"
          fi
          bash .github/scripts/commit-in-batches.sh "$HANDOFF/commit-message.txt" "$COMMIT_FILES_PER_COMMIT"

      - name: Push the default branch (direct commits)
        if: steps.mode.outputs.mode == 'direct'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Refusing to push: $GITHUB_REF_NAME is not the default branch ($DEFAULT_BRANCH)."
            exit 1
          fi
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "HEAD:refs/heads/$DEFAULT_BRANCH"

      - name: Push a branch and open a pull request (changes that need review)
        if: steps.mode.outputs.mode == 'review'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          HANDOFF: ${{ runner.temp }}/handoff
          REASONS: ${{ steps.mode.outputs.reasons }}
        run: |
          branch="$(git rev-parse --abbrev-ref HEAD)"
          case "$branch" in auto/*) ;; *) echo "::error::Unexpected branch $branch"; exit 1 ;; esac
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "HEAD:refs/heads/$branch"

          title="$(head -n 1 "$HANDOFF/commit-message.txt")"
          {
            cat "$HANDOFF/pr-body.md"
            printf '\n---\n'
            printf '_Opened automatically by the daily improvement workflow because: %s._\n' "${REASONS:-it needs review}"
            printf '_Validated before opening (guards, lint, type check, tests, build). Nothing here has been merged to `%s`; review and merge it yourself._\n' "$DEFAULT_BRANCH"
          } > "$RUNNER_TEMP/pr-description.md"

          gh pr create --base "$DEFAULT_BRANCH" --head "$branch" \
            --title "$title" --body-file "$RUNNER_TEMP/pr-description.md"
